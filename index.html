<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Form</title>
    </head>
    <body>
        <main>
            <div class="right-side">
                <p class="photo-credit">
                    Photo by <a href="#">Halie West</a> on
                    <a href="#">Unsplash</a>
                </p>
            </div>
            <div class="content">
                <div class="toper">
                    <p>
                        This is not a real online service! You know you need
                        something like this in your life to help you realize
                        your deepest dreams. <br />
                        Sign up <em>now</em> to get started.
                    </p>
                    <h3>You <em>know</em> you want to.</h3>
                </div>
                <form action="">
                    <div class="sign-in-wrapper">
                        <h2>Let's do this!</h2>
                        <div class="sign-up-content">
                            <div class="row">
                                <div class="sign-up-item">
                                    <label for="f-name">FIRST NAME</label>
                                    <input
                                        type="text"
                                        name="f-name"
                                        id="f-name"
                                    />
                                </div>
                                <div class="sign-up-item">
                                    <label for="l-name">LAST NAME</label>
                                    <input
                                        type="text"
                                        name="l-name"
                                        id="l-name"
                                    />
                                </div>
                            </div>
                            <div class="row">
                                <div class="sign-up-item">
                                    <label for="email">Email</label>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        required
                                    />
                                </div>
                                <div class="sign-up-item">
                                    <label for="phone-number"
                                        >PHONE NUMBER</label
                                    >
                                    <input
                                        type="tel"
                                        id="phone-number"
                                        name="phone-number"
                                    />
                                </div>
                            </div>
                            <div class="row">
                                <div class="sign-up-item">
                                    <label for="password">Password</label>
                                    <input
                                        type="password"
                                        name="password"
                                        id="password"
                                        required
                                        minlength="8"
                                    />
                                </div>
                                <div class="sign-up-item">
                                    <label for="confirm-password"
                                        >CONFIRM Password</label
                                    >
                                    <input
                                        type="password"
                                        name="confirm-password"
                                        id="confirm-password"
                                        required
                                        minlength="8"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="sign-up-footer">
                        <button type="submit">Create Account</button>
                        <p>Already have an account? <a href="#">Log in</a></p>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
